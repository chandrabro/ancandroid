plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.calmzone'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.calmzone'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No third-party dependencies on purpose: fewer things that can fail to download or build.
